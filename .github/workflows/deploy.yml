name: Deploy

# Backend + portal to the VPS shared with another project. The only thing CI can do on the host is run
# /usr/local/sbin/edrsr-deploy (forced command of the deploy key, source: deploy/edrsr-deploy.sh).
# The portal is built here, not on the 2 GB host. Runbook: docs/DEPLOYMENT.md, "Deploy from GitHub".

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install deps
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix web ci

      - name: Checks
        run: |
          npm run test:selfcheck
          node server/scripts/test-prompts.js
          node server/scripts/test-security-regressions.js
          node server/scripts/test-markdown-xss-regressions.js

      - name: Build portal
        env:
          # same public values the extension ships (extension/config.js); no secrets here
          VITE_SUPABASE_URL: 'https://hosvrzhfdotstghdoycv.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhvc3ZyemhmZG90c3RnaGRveWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMDc2ODQsImV4cCI6MjA4Mzc4MzY4NH0.7duRICE5bhuJP-amqapCPJfngGYBfN9EgPBSfi4ewhw'
          VITE_DEV_AUTH_ENABLED: 'false'
        run: npm --prefix web run build

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C web/dist -cz . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"
